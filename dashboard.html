<meta name="viewport" content="width=device-width,initial-scale=1">
<title>은행 고객 이탈 리텐션 대시보드</title>
<style>
:root{--royal:#1D4ED8;--cobalt:#2563EB;--ice:#DBEAFE;--ice2:#EFF4FE;--ink:#1F2933;--muted:#6B7280;--line:#E6EAF2;--red:#DC2626;--bg:#F7F9FC;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
header{margin-bottom:22px}
.badge{display:inline-block;background:var(--ice);color:var(--royal);font-size:12px;font-weight:700;letter-spacing:1px;padding:5px 11px;border-radius:20px;margin-bottom:12px}
h1{font-size:27px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14.5px;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.kpi .n{font-size:28px;font-weight:800;color:var(--royal)}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi.alt .n{color:var(--cobalt)}
.section-t{font-size:13px;font-weight:700;color:var(--royal);letter-spacing:2px;text-transform:uppercase;margin:26px 0 12px}
.seg{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:8px}
.segrow{display:flex;align-items:center;gap:12px;margin:9px 0}
.segrow .lab{width:78px;font-size:13px;font-weight:600}
.segrow .bar{flex:1;background:var(--ice2);border-radius:8px;height:16px;overflow:hidden}
.segrow .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--cobalt),var(--royal))}
.segrow .v{width:44px;text-align:right;font-size:13px;font-weight:700;color:var(--royal)}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--white);color:var(--muted);font-size:13px;font-weight:600;padding:7px 14px;border-radius:20px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--cobalt);color:var(--cobalt)}
.chip.on{background:var(--royal);border-color:var(--royal);color:#fff}
.list{display:flex;flex-direction:column;gap:9px;max-height:640px;overflow-y:auto;padding-right:4px}
.cust{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
.cust:hover{border-color:var(--cobalt);box-shadow:0 3px 12px rgba(37,99,235,.10)}
.cust.on{border-color:var(--royal);box-shadow:0 3px 14px rgba(29,78,216,.18)}
.cust .idc{font-weight:700;font-size:14px;min-width:66px}
.cust .tag{font-size:11.5px;font-weight:700;color:var(--royal);background:var(--ice);padding:3px 9px;border-radius:12px;white-space:nowrap}
.cust .meta{flex:1;font-size:12px;color:var(--muted)}
.cust .risk{font-weight:800;font-size:15px;color:var(--red)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;position:sticky;top:18px;align-self:start}
.panel h3{font-size:16px;font-weight:800;margin-bottom:2px}
.ptag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--royal);padding:3px 11px;border-radius:12px;margin-bottom:14px}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.attr{background:var(--ice2);border-radius:10px;padding:9px 11px}
.attr .k{font-size:11px;color:var(--muted)}
.attr .v{font-size:14px;font-weight:700;margin-top:2px}
.blk{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px}
.shap .r{display:flex;align-items:center;gap:10px;margin:6px 0}
.shap .f{width:88px;font-size:12.5px;font-weight:600;text-align:right}
.shap .track{flex:1;height:14px;background:var(--ice2);border-radius:7px;position:relative;overflow:hidden}
.shap .pos{position:absolute;left:50%;height:100%;background:var(--red);border-radius:0 7px 7px 0}
.shap .neg{position:absolute;right:50%;height:100%;background:var(--cobalt);border-radius:7px 0 0 7px}
.shap .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#c3ccdb}
.strat{background:var(--ice);border-radius:12px;padding:14px 16px;font-size:13.5px;font-weight:600;color:var(--royal)}
.mail{background:#0F1B3D;color:#e7edfb;border-radius:12px;padding:16px 18px;font-size:12.5px;white-space:pre-wrap;line-height:1.6;margin-top:8px}
.mail b{color:#9CC0FF}
.foot{color:var(--muted);font-size:12px;margin-top:26px;text-align:center}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.panel{position:static}}

const $=s=>document.querySelector(s);
// KPIs
$("#kpis").innerHTML=[
 [DASH.kpis.customers.toLocaleString(),"평가 고객 수",""],
 [DASH.kpis.churn+"%","전체 이탈률",""],
 [DASH.kpis.high_risk.toLocaleString(),"고위험 고객 (p>0.5)","alt"],
 [DASH.kpis.lift20+"%","상위 20% 접촉 시 포착","alt"]
].map(k=>`<div class="kpi ${k[2]}"><div class="n">${k[0]}</div><div class="l">${k[1]}</div></div>`).join("");
// segments
const mx=Math.max(...DASH.segments.map(s=>s[1]));
$("#seg").innerHTML=DASH.segments.map(s=>`<div class="segrow"><div class="lab">${s[0]}</div><div class="bar"><div class="fill" style="width:${s[1]/mx*100}%"></div></div><div class="v">${s[1]}%</div></div>`).join("");
// chips
const arches=[...new Set(DASH.customers.map(c=>c.arche))];
let filter="전체";
function renderChips(){
 $("#chips").innerHTML=["전체",...arches].map(a=>`<div class="chip ${a===filter?'on':''}" data-a="${a}">${a}${a==="전체"?"":" ("+DASH.customers.filter(c=>c.arche===a).length+")"}</div>`).join("");
 document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filter=c.dataset.a;renderChips();renderList();});
}
function renderList(){
 const cs=DASH.customers.filter(c=>filter==="전체"||c.arche===filter);
 $("#list").innerHTML=cs.map((c,i)=>`<div class="cust" data-id="${c.id}"><div class="idc">#${c.id}</div><span class="tag">${c.arche}</span><div class="meta">${c.attrs.국가} · ${c.attrs.나이}세 · 상품${c.attrs.상품수} · ${c.attrs.활성}</div><div class="risk">${Math.round(c.prob*100)}%</div></div>`).join("");
 document.querySelectorAll(".cust").forEach(el=>el.onclick=()=>{document.querySelectorAll(".cust").forEach(x=>x.classList.remove("on"));el.classList.add("on");renderPanel(cs.find(c=>c.id==el.dataset.id));});
 if(cs.length){document.querySelector(".cust").classList.add("on");renderPanel(cs[0]);}
}
function renderPanel(c){
 const dmax=Math.max(...c.drivers.map(d=>Math.abs(d[1])));
 const bars=c.drivers.map(d=>{const w=Math.abs(d[1])/dmax*50;const side=d[1]>=0?`<div class="pos" style="width:${w}%"></div>`:`<div class="neg" style="width:${w}%"></div>`;return `<div class="r"><div class="f">${d[0]}</div><div class="track"><div class="mid"></div>${side}</div></div>`}).join("");
 const attrs=Object.entries(c.attrs).map(([k,v])=>`<div class="attr"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
 const em=c.email.replace(/^제목: (.*)$/m,'<b>제목: $1</b>');
 $("#panel").innerHTML=`<span class="ptag">${c.arche}</span><h3>고객 #${c.id} · 이탈확률 ${Math.round(c.prob*100)}%</h3>
 <div class="blk">고객 프로파일</div><div class="attrs">${attrs}</div>
 <div class="blk">이탈 요인 (SHAP · 빨강=위험↑, 파랑=방어)</div><div class="shap">${bars}</div>
 <div class="blk">추천 리텐션 전략</div><div class="strat">${DASH.archetypes[c.arche].strategy}</div>
 <div class="blk">LLM 맞춤 리텐션 이메일</div><div class="mail">${em}</div>`;
}
renderChips();renderList();
</script></body></html>
